<div class="text-[#0d47a1] dark:text-[#d9e2ff] p-2 hover:bg-[#e0e3e6] dark:hover:bg-[#3f4144] rounded-full scale-98 transition-transform duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="notifications_active" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto px-4 pt-6 pb-32 space-y-8 relative">
<!-- Today's Status Header -->
<section class="flex flex-col gap-4">
<div class="bg-surface-container-lowest rounded-[2rem] p-6 shadow-[0_8px_24px_rgba(25,28,30,0.06)] relative overflow-hidden flex flex-col justify-between">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container opacity-5 rounded-bl-full -mr-10 -mt-10"></div>
<div class="flex justify-between items-start mb-6 relative z-10">
<div>
<h2 class="text-on-surface-variant font-label text-sm uppercase tracking-wider font-semibold">Today • Monday</h2>
<div class="flex items-center gap-2 mt-1">
<span class="w-2.5 h-2.5 rounded-full bg-secondary animate-pulse"></span>
<p class="font-headline font-extrabold text-2xl text-on-surface tracking-tight">Active</p>
</div>
</div>
<span class="material-symbols-outlined text-primary-container text-3xl" style="font-variation-settings: 'FILL' 1;">alarm_on</span>
</div>
<button class="w-full bg-surface-container text-on-surface font-label font-medium py-3.5 rounded-xl border border-outline-variant/15 hover:bg-surface-variant transition-colors flex items-center justify-center gap-2 active:scale-[0.98]">
<span class="material-symbols-outlined text-lg">alarm_off</span>
                    Turn off for today
                </button>
</div>
</section>

<div class="relative w-48 h-48 flex items-center justify-center">

<circle class="text-surface-container-high" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="6"></circle>
<circle class="text-tertiary stroke-current" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="282.7" stroke-dashoffset="56.5" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="text-center z-10 flex flex-col items-center">
<span class="font-headline font-black text-6xl text-tertiary tracking-tighter leading-none">5</span>
<span class="font-label text-on-surface-variant text-sm font-medium mt-1">min to stop</span>
</div>
</div>
</section>
<!-- Real-time Bus Info -->
<section class="space-y-4">
<h3 class="font-headline font-bold text-xl text-on-surface px-2">Next Buses • Route 1002</h3>

<div class="bg-surface-container-lowest rounded-[2rem] p-1 shadow-[0_8px_24px_rgba(25,28,30,0.06)] flex flex-col relative overflow-hidden group">
<!-- Ambient warning glow -->
<div class="absolute inset-0 bg-gradient-to-br from-tertiary-container/10 to-transparent pointer-events-none"></div>
<div class="flex justify-between items-stretch pl-5 pr-4 py-5 relative z-10">
<div class="flex flex-col justify-center">
<span class="font-label text-tertiary-container text-xs font-bold uppercase tracking-wider mb-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">warning</span> MUST CATCH
                         </span>
<div class="flex items-baseline gap-1">
<span class="font-headline font-black text-4xl text-on-surface tracking-tighter">5</span>
<span class="font-label text-on-surface-variant text-base font-medium">min</span>
</div>
</div>
<div class="flex flex-col items-end text-right justify-center pl-4 border-l border-outline-variant/15">
<span class="font-label text-on-surface-variant text-xs">Arrival at Work</span>
<span class="font-headline font-bold text-lg text-on-surface">08:55</span>
<span class="font-label text-tertiary-container text-xs mt-0.5">Start 09:00</span>
</div>
</div>
</div>
<!-- Next Bus (Critical) -->
<div class="bg-tertiary-container rounded-[2rem] p-1 shadow-[0_8px_24px_rgba(25,28,30,0.1)] flex flex-col relative overflow-hidden mt-4">
<div class="flex justify-between items-stretch pl-5 pr-4 py-5 relative z-10">
<div class="flex flex-col justify-center">
<span class="font-label text-on-tertiary-container text-xs font-bold uppercase tracking-wider mb-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">error</span> LATE
                         </span>
<div class="flex items-baseline gap-1">
<span class="font-headline font-black text-4xl text-on-tertiary tracking-tighter">22</span>
<span class="font-label text-on-tertiary-container text-base font-medium">min</span>

</div>

<span class="font-label text-on-tertiary-container text-xs mt-0.5 opacity-80">Start 09:00</span>
</div>
</div>
</div>

<span class="material-symbols-outlined text-3xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>

</section>
