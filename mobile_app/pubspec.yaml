name: buswakeup_mobile
description: BusWakeUp cross-platform mobile shell for Seoul and Gyeonggi launch.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.9
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  vibration: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
