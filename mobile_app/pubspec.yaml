name: buswakeup_mobile
description: 이노치(이거 놓치면 지각) 출근 알림 앱.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  app_links: ^7.2.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  kakao_map_sdk: ^1.2.0
  url_launcher: ^6.3.2
  supabase_flutter: ^2.10.0
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.9
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  vibration: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    # SIL Open Font License 1.1 (assets/fonts/BlackHanSans-OFL.txt)
    - family: BlackHanSans
      fonts:
        - asset: assets/fonts/BlackHanSans-Regular.ttf
